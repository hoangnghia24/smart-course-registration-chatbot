class: Student
table: app_student
serverOnly: true

fields:
  userAccountId: int, relation(parent=app_user_account)
  studentCode: String
  curriculumVersionId: int, relation(parent=app_curriculum_version)
  academicStatus: String

  ### F07 - Nam nhap hoc. Dung de tu dong chon phien ban CTDT theo nam
  ### hieu luc (hoc che tin chi). Nullable de tuong thich du lieu cu.
  admissionYear: int?

indexes:
  app_student_account_unique:
    fields: userAccountId
    unique: true

  app_student_code_unique:
    fields: studentCode
    unique: true
