
class: AcademicTerm
table: app_academic_term

fields:
  academicYear: String

  termName: String

  # Trang thai hoc ky:
  # PLANNED, ACTIVE, CLOSED, COMPLETED
  status: String

  maxCreditsPerTerm: double

  ### thời gian bắt đầu và kết thúc học kỳ
  startAt: DateTime
  endAt: DateTime

indexes:
  academic_term_year_name_unique_idx:
    fields: academicYear, termName
    unique: true
