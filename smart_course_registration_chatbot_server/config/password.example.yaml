
# Serverpod secrets - Local development only

development:
  # PostgreSQL
  database: 'THAY_BANG_MAT_KHAU_POSTGRES'

  # Serverpod internal services
  serviceSecret: 'THAY_BANG_KHOA_BI_MAT_NGAU_NHIEN'

  # Authentication session
  serverSideSessionKeyHashPepper: 'THAY_BANG_SESSION_PEPPER'

  # JWT authentication
  jwtRefreshTokenHashPepper: 'THAY_BANG_REFRESH_TOKEN_PEPPER'
  jwtHmacSha512PrivateKey: 'THAY_BANG_JWT_SIGNING_KEY'

  # Email authentication
  emailSecretHashPepper: 'THAY_BANG_EMAIL_PEPPER'
